<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF → книга для ридера</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">
<meta name="theme-color" content="#a15c3e">
<style>
  :root{--paper:#f6f1e9;--card:#ffffff;--ink:#2b2420;--muted:#8a7f72;--accent:#a15c3e;--accent-dark:#7e4630;--line:#e8e0d4;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:20px 14px 40px;}
  .wrap{max-width:440px;margin:0 auto;}
  h1{font-size:20px;text-align:center;margin-bottom:20px;}
  .card{background:var(--card);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(43,36,32,0.06);border:1px solid var(--line);}
  .card-label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px;}
  input[type=file]{width:100%;}
  input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--paper);color:var(--ink);margin-top:6px;}
  button{font:inherit;border:none;border-radius:10px;padding:12px 16px;font-weight:600;font-size:14px;cursor:pointer;width:100%;margin-top:10px;background:var(--accent);color:#fff;}
  button:disabled{opacity:.5;cursor:default;}
  progress{width:100%;margin-top:10px;accent-color:var(--accent);}
  #statusText{font-size:13px;color:var(--muted);margin-top:8px;white-space:pre-line;}
  .hint{font-size:12px;color:var(--muted);margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📖 PDF → книга для ридера</h1>

  <div class="card">
    <div class="card-label">1. Выберите PDF</div>
    <input type="file" id="pdfInput" accept="application/pdf">
  </div>

  <div class="card">
    <div class="card-label">2. Конвертация</div>
    <button id="btnConvert" disabled>Конвертировать</button>
    <progress id="progressBar" value="0" max="1" style="display:none;"></progress>
    <div id="statusText"></div>
  </div>

  <div class="card">
    <div class="card-label">3. Загрузка на устройство</div>
    <label>IP ридера (виден на экране устройства)</label>
    <input type="text" id="ipInput" value="192.168.4.1">
    <button id="btnUpload" disabled>Загрузить на устройство</button>
    <div class="hint">Откроется новая вкладка — браузер может спросить подтверждение
      (т.к. устройство работает по обычному http, не https). Это нормально, жмите
      "продолжить"/"отправить". После загрузки вкладку можно закрыть.</div>
  </div>

  <!-- Скрытая форма: реальный submit (не fetch), чтобы не упираться в блокировку
       mixed content. Файл подставляется в hiddenFileInput через DataTransfer. -->
  <form id="uploadForm" method="POST" enctype="multipart/form-data" target="_blank" style="display:none;">
    <input type="file" name="file" id="hiddenFileInput">
  </form>
</div>

<script src="./pdf.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
